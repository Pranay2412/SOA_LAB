server:
  port: 8080
spring:
  application:
    name: api-gateway
cloud:
  gateway:
    routes:
      - id: product-service-route
        uri: lb://PRODUCT-SERVICE
        predicates:
          - Path=/api/products/**
        filters:
          - StripPrefix=1
      - id: order-service-route
        uri: lb://ORDER-SERVICE
        predicates:
          - Path=/api/orders/**
        filters:
          - StripPrefix=1
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
